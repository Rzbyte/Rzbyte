<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Three layers: DETECT, DECIDE, ACT">
  <defs>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e75b6" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0e75b6" stop-opacity="0.02"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="340" fill="#FFFFFF"/>

  <!-- konektor -->
  <g stroke="#D0D7DE" stroke-width="1.5" stroke-dasharray="5 5" fill="none">
    <path d="M382 170H436"/>
    <path d="M782 170H836"/>
  </g>
  <g fill="#D0D7DE">
    <path d="M436 170l-8-4.5v9z"/>
    <path d="M836 170l-8-4.5v9z"/>
  </g>

  <!-- PANEL 1 -->
  <rect x="40" y="42" width="340" height="256" rx="10" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
  <text x="68" y="80" font-family="SFMono-Regular,Consolas,monospace" font-size="12" fill="#6A737D" letter-spacing="2">01</text>
  <text x="104" y="81" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#1F2328" letter-spacing="1">DETECT</text>
  <text x="68" y="106" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#57606A">notice something</text>
  <path d="M68 124H352" stroke="#E4E9EF" stroke-width="1"/>
  <g font-family="SFMono-Regular,Consolas,monospace" font-size="14" fill="#1F2328">
    <text x="68" y="160">FSignal</text>
    <text x="68" y="204">whale-pacifica</text>
    <text x="68" y="248">TraceVault</text>
  </g>
  <g font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6A737D">
    <text x="68" y="178">founder signals, 4.4d lead</text>
    <text x="68" y="222">whale + liquidation flow</text>
    <text x="68" y="266">incident recall</text>
  </g>

  <!-- PANEL 2 -->
  <rect x="440" y="42" width="340" height="256" rx="10" fill="url(#mid)" stroke="#0e75b6" stroke-width="2"/>
  <text x="468" y="80" font-family="SFMono-Regular,Consolas,monospace" font-size="12" fill="#0e75b6" letter-spacing="2">02</text>
  <text x="504" y="81" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#1F2328" letter-spacing="1">DECIDE</text>
  <text x="468" y="106" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#57606A">is it safe?</text>
  <path d="M468 124H752" stroke="#0e75b6" stroke-width="1" opacity="0.35"/>
  <g font-family="SFMono-Regular,Consolas,monospace" font-size="14" fill="#1F2328">
    <text x="468" y="160">SafeHands</text>
    <text x="468" y="204">PhylaX</text>
  </g>
  <g font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6A737D">
    <text x="468" y="178">ALLOW / BLOCK before signing</text>
    <text x="468" y="222">token risk + route scan</text>
  </g>
  <text x="468" y="268" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-style="italic" fill="#0e75b6">the layer I keep coming back to</text>

  <!-- PANEL 3 -->
  <rect x="840" y="42" width="340" height="256" rx="10" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
  <text x="868" y="80" font-family="SFMono-Regular,Consolas,monospace" font-size="12" fill="#6A737D" letter-spacing="2">03</text>
  <text x="904" y="81" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#1F2328" letter-spacing="1">ACT</text>
  <text x="868" y="106" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#57606A">act on it</text>
  <path d="M868 124H1152" stroke="#E4E9EF" stroke-width="1"/>
  <g font-family="SFMono-Regular,Consolas,monospace" font-size="14" fill="#1F2328">
    <text x="868" y="160">Rivo</text>
    <text x="868" y="204">Piggy Sentinel</text>
    <text x="868" y="248">CollabOS</text>
  </g>
  <g font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6A737D">
    <text x="868" y="178">agent validation, 2179 contracts</text>
    <text x="868" y="222">non-custodial savings</text>
    <text x="868" y="266">partnership agent, 232 tests</text>
  </g>
</svg>
